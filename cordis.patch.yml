# dsh-deep-research —— 本 bundle 贡献的配置层。
#
# 只插入插件自己的一行。`config` 是**整体替换**而非深合并：
# 在 profile 的 cordis.patch.yml 里覆盖时，要把想保留的字段一并写全。
- insert:
    - id: deep-research
      name: 'dsh-deep-research'
      config:
        # 是否注册 deep_research 工具。
        enableTools: true
        # 未显式传 depth 时使用的研究档位：quick（1 轮）/ standard（2 轮）/ deep（更大预算）。
        defaultDepth: standard
        # 以下四个上限同时作用于一次工具调用（模型传入更小的值时取更小值）。
        maxQueries: 5
        maxSources: 12
        fetchTop: 4
        fetchCharBudget: 60000
        # 单次 search / fetch 的超时与整次工具调用的超时（毫秒）。
        searchTimeoutMs: 20000
        fetchTimeoutMs: 30000
        toolTimeoutMs: 120000
        # 账号兜底搜索：宿主 search 失败（如 DEEPSEEK_API_KEY 失效 401）时，
        # 用已登录账号 token 直连 DeepSeek Search API。false = 关闭兜底，
        # 宿主失败原样抛出。
        searchFallback: true
        # 兜底搜索的端点/模型/预算（与内置 web-search-deepseek 的语义一致）。
        searchBaseUrl: 'https://api.deepseek.com/anthropic/v1'
        searchModel: deepseek-chat
        searchMaxTokens: 2048
        searchMaxUses: 5

