<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Deep research">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2a33"/>
      <stop offset="1" stop-color="#07141c"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ff0d6"/>
      <stop offset="1" stop-color="#22a58a"/>
    </linearGradient>
    <linearGradient id="strata" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ad7ff"/>
      <stop offset="1" stop-color="#2c7fb8"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
  <!-- 三层「来源地层」 -->
  <path d="M13 46c5.5 2.6 11 2.6 16.5 0" fill="none" stroke="url(#strata)" stroke-width="2.4" stroke-linecap="round" opacity="0.85"/>
  <path d="M15 52c4.6 2 9.2 2 13.8 0" fill="none" stroke="url(#strata)" stroke-width="2.2" stroke-linecap="round" opacity="0.6"/>
  <path d="M17 58c3.6 1.4 7.2 1.4 10.8 0" fill="none" stroke="url(#strata)" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <!-- 证据节点 -->
  <circle cx="20" cy="22" r="2.4" fill="#8ff0d6"/>
  <circle cx="29" cy="16" r="1.9" fill="#5ad7ff"/>
  <!-- 放大镜 -->
  <circle cx="33" cy="32" r="12.5" fill="rgba(143,240,214,0.08)" stroke="url(#lens)" stroke-width="3.2"/>
  <path d="M42 41.5 51.5 51" fill="none" stroke="url(#lens)" stroke-width="5" stroke-linecap="round"/>
  <!-- 镜中「证据条」 -->
  <path d="M27 27h12M27 32h9M27 37h6" fill="none" stroke="#bff8e8" stroke-width="2" stroke-linecap="round" opacity="0.95"/>
</svg>
